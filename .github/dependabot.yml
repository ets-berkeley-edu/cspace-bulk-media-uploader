# Weekly update pull requests (Mondays), grouped so there are few of them. Each one runs CI like any other PR.
# Python: the requirements files are pip-compile output (backend/pin-requirements.sh); Dependabot reruns pip-compile
# with the options in each file's header. Check the first pip PR: it should change only the requirements files' pins
# and hashes, not pyproject.toml (docs/testing-checklist.md, section 5). Base images: only patch updates are offered,
# so Python stays on .python-version's 3.11 and Node on 22; moving either is a deliberate change.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/Los_Angeles }
    ignore:
      # requirements-tools.in caps click below 8.5 (pip-tools 7.6.1 header bug); lift both together.
      - dependency-name: "click"
        versions: [">=8.5"]
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/Los_Angeles }
    ignore:
      # ESLint 10 waits until eslint-plugin-import supports it (or we move to eslint-plugin-import-x).
      - dependency-name: "eslint"
        update-types: [version-update:semver-major]
      - dependency-name: "@eslint/js"
        update-types: [version-update:semver-major]
      # TypeScript 7 waits until typescript-eslint and vue-tsc support it.
      - dependency-name: "typescript"
        update-types: [version-update:semver-major]
      # Vuetify 4 is a deliberate upgrade, done on its own branch after the UI review.
      - dependency-name: "vuetify"
        update-types: [version-update:semver-major]
    groups:
      # Minor and patch updates together; a major update (a new Vue or Vuetify, say) comes as its own PR.
      frontend:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/Los_Angeles }
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/backend, /deploy]
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/Los_Angeles }
    ignore:
      - dependency-name: "*python"
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: "*node"
        update-types: [version-update:semver-major]
    groups:
      images:
        patterns: ["*"]
