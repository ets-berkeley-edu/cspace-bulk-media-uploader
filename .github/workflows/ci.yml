name: CI
on:
  push:
  pull_request:
# The workflow's token can only read the repository: no job here writes to GitHub.
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version-file: .python-version }
      # Only the pinned versions, checked against their hashes (requirements files: see pin-requirements.sh).
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: pip install --no-deps --no-build-isolation -e .
      - run: pytest -q
  dependencies:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version-file: .python-version }
      - run: pip install --require-hashes -r requirements-tools.txt
      - name: The requirements files match pyproject.toml and requirements-tools.in
        run: |
          ./pin-requirements.sh
          git diff --exit-code -- . || {
            echo "::error::The requirements files are out of step. Run backend/pin-requirements.sh and commit the result."
            exit 1
          }
      - name: No known vulnerabilities in the pinned Python packages
        run: |
          # Two runs: the tools file pins click differently (see requirements-tools.in), and pip-audit refuses a
          # package pinned twice.
          pip-audit --require-hashes --disable-pip -r requirements.txt -r requirements-dev.txt
          pip-audit --require-hashes --disable-pip -r requirements-tools.txt
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
