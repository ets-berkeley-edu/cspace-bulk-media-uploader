name: CI
on:
  # Pushes to main only; a PR branch is covered by its pull_request run.
  push:
    branches: [main]
  pull_request:
# The workflow's token can only read the repository: no job here writes to GitHub.
permissions:
  contents: read
# A pull request that changes only documentation skips backend, frontend, bmut and terraform. They are skipped with
# `if:`, not left out with paths-ignore, so each still reports (as skipped, which counts as passing) and a required
# check never waits on "Expected". The `dependencies` job and everything in security.yml run on every pull request
# and every push, whatever changed: README and docs files are where a secret or personal data most often leaks.
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      # A pull request's checkout is its merge commit with the base branch, whose first parent is the base: the diff
      # between the two is exactly what merging would change.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with: { fetch-depth: 2, persist-credentials: false }
      - name: Documentation only?
        id: classify
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # Pushes to main always run everything.
          if [ "$EVENT" != pull_request ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames: a rename counts as its old path and its new one, so code renamed to .md is a code change.
          mapfile -t files < <(git diff --name-only --no-renames HEAD^1 HEAD)
          docs_only=true
          [ "${#files[@]}" -gt 0 ] || docs_only=false
          for f in "${files[@]}"; do
            # Documentation: docs/, any .md file, LICENSE, and issue or pull request templates. Anything else under
            # .github/ (workflows, dependabot.yml) is checked before the .md rule, so it always runs everything.
            # A file name git had to quote (newlines, control characters) starts with " and so counts as code.
            case "$f" in
              .github/ISSUE_TEMPLATE/* | .github/PULL_REQUEST_TEMPLATE/* | .github/pull_request_template.md) kind=docs ;;
              .github/*) kind=code ;;
              docs/* | *.md | LICENSE) kind=docs ;;
              *) kind=code ;;
            esac
            [ "$kind" = docs ] || docs_only=false
            # Indented, so a file name can't be read as a workflow command (those start at the beginning of a line).
            printf '  %-4s  %s\n' "$kind" "$f"
          done
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "Documentation only: $docs_only"

  backend:
    needs: changes
    # Runs unless `changes` said "documentation only". If `changes` itself fails, its output is empty and this runs:
    # a broken classifier must never turn into a skipped (passing) required check.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version-file: .python-version }
      # Only the pinned versions, checked against their hashes (requirements files: see pin-requirements.sh).
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: pip install --no-deps --no-build-isolation -e .
      - run: pytest -q
  dependencies:
    # Security: always runs (pip-audit, and the hash-pinned requirements files in step). No `needs`, no `if`.
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version-file: .python-version }
      - run: pip install --require-hashes -r requirements-tools.txt
      - name: The requirements files match pyproject.toml, requirements-sim.in and requirements-tools.in
        run: |
          ./pin-requirements.sh
          git diff --exit-code -- . || {
            echo "::error::The requirements files are out of step. Run backend/pin-requirements.sh and commit the result."
            exit 1
          }
      - name: No known vulnerabilities in the pinned Python packages
        run: |
          # Two runs: the tools file pins click differently (see requirements-tools.in), and pip-audit refuses a
          # package pinned twice.
          pip-audit --require-hashes --disable-pip -r requirements.txt -r requirements-dev.txt -r requirements-sim.txt
          pip-audit --require-hashes --disable-pip -r requirements-tools.txt
  frontend:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22.23.4", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  bmut:
    # The Selenium tests (bmut/README.md): ./bmu test starts the bmu-test stack (the simulated CollectionSpace, moto,
    # DynamoDB Local) in Docker with throwaway keys, and runs the suite in the runner's Chrome. No secrets: the
    # accounts are the simulator's synthetic ones. Not a required check until it has run a while without a flaky
    # failure (testing checklist section 17).
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # id-token: an OIDC token for the ECR Public sign-in below, and nothing else; GitHub gives none to a fork's pull
    # request, which then pulls without signing in.
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with: { python-version-file: .python-version }
      # Signed-in pulls from ECR Public (the Dockerfiles' base images) have a far higher limit than anonymous ones,
      # which GitHub's shared runner addresses run out of (429 "Data limit exceeded"). The role (deploy/terraform/ci,
      # ./bmu aws ci-role) can only get a pull token. Its ARN is the repository's Actions variable ECR_PUBLIC_ROLE_ARN,
      # not committed because it holds the account number; without it, or on a fork's pull request, these are skipped.
      # A failed sign-in doesn't fail the job: the pulls are then anonymous, as before, and the step shows the error.
      - name: Sign in to AWS for ECR Public
        id: aws
        continue-on-error: true
        if: vars.ECR_PUBLIC_ROLE_ARN != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.ECR_PUBLIC_ROLE_ARN }}
          role-session-name: bmut-${{ github.run_id }}
          aws-region: us-east-1   # ECR Public's sign-in is in us-east-1 only
      - name: Sign in to ECR Public
        if: steps.aws.outcome == 'success'
        continue-on-error: true
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with: { registry-type: public }
      - name: ./bmu test
        env:
          BMUT_PYTHON: ${{ steps.python.outputs.python-path }}
        run: ./bmu test -v
      # What a failed test saw: its screenshot and page HTML, and the end of each service's log (synthetic data only;
      # the app's logs leave out passwords and keys).
      - name: The services' logs
        if: failure()
        run: |
          for c in $(docker ps -aq --filter label=com.docker.compose.project=bmu-test); do
            echo "::group::$(docker inspect --format '{{.Name}}' "$c")"
            docker logs --tail 200 "$c" 2>&1
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: bmut-failures
          path: bmut/.run/failures/
          if-no-files-found: ignore
          retention-days: 14
  terraform:
    # deploy/terraform: formatting, validation against the provider, and terraform test (a simulated AWS provider).
    # Nothing here signs in to AWS or reads Terraform state.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    env: { TF_IN_AUTOMATION: "1", TF_INPUT: "0" }
    defaults: { run: { working-directory: deploy/terraform } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # Pinned by commit; Dependabot moves the pin and its comment together.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false
      - name: Formatting (terraform fmt -recursive deploy/terraform fixes it)
        run: terraform fmt -check -recursive -diff
      # -lockfile=readonly: the providers must be the ones .terraform.lock.hcl pins, with its checksums.
      - name: Validate the image repository's configuration
        working-directory: deploy/terraform/registry
        run: |
          terraform init -backend=false -lockfile=readonly
          terraform validate
      - name: Validate and test the app's configuration
        working-directory: deploy/terraform/app
        run: |
          terraform init -backend=false -lockfile=readonly
          terraform validate
          terraform test
      - name: Validate and test CI's ECR Public role
        working-directory: deploy/terraform/ci
        run: |
          terraform init -backend=false -lockfile=readonly
          terraform validate
          terraform test
