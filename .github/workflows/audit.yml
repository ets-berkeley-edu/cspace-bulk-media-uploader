# Every Monday morning (Pacific), and on demand: checks the pinned packages for newly published vulnerabilities, so a
# problem shows up even in a week nobody pushes. CI (ci.yml) runs the same Python check on every push.
name: Dependency audit
on:
  schedule:
    - cron: "17 14 * * 1"   # 14:17 UTC: 7:17 AM PDT, 6:17 AM PST
  workflow_dispatch:
jobs:
  python:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version-file: .python-version }
      - run: pip install --require-hashes -r requirements-tools.txt
      - run: pip-audit --require-hashes --disable-pip -r requirements.txt -r requirements-dev.txt -r requirements-tools.txt
  npm:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm audit
