# Every Monday morning (Pacific), and on demand: checks the pinned packages for newly published vulnerabilities, so a
# problem shows up even in a week nobody pushes. CI (ci.yml) runs the same Python check on every push.
name: Dependency audit
on:
  schedule:
    - cron: "17 14 * * 1"   # 14:17 UTC: 7:17 AM PDT, 6:17 AM PST
  workflow_dispatch:
# The workflow's token can only read the repository: no job here writes to GitHub.
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version-file: .python-version }
      - run: pip install --require-hashes -r requirements-tools.txt
      - run: |
          # Two runs: the tools file pins click differently (see requirements-tools.in), and pip-audit refuses a
          # package pinned twice.
          pip-audit --require-hashes --disable-pip -r requirements.txt -r requirements-dev.txt
          pip-audit --require-hashes --disable-pip -r requirements-tools.txt
  npm:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - run: npm audit
