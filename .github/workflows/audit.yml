# Every Monday morning (Pacific), and on demand: checks the pinned packages for newly published vulnerabilities, so a
# problem shows up even in a week nobody pushes. CI (ci.yml) runs the same Python check on every push. Both checks here
# are the full ones, as on a push to main: on a pull request, ci.yml's and security.yml's fail only for what the pull
# request changes and only warn of the rest, so this run and main's are what turn red when a new vulnerability is
# published, and keep frontend/audit-allowlist.json up to date.
name: Dependency audit
on:
  schedule:
    - cron: "17 14 * * 1"   # 14:17 UTC: 7:17 AM PDT, 6:17 AM PST
  workflow_dispatch:
# The workflow's token can only read the repository: no job here writes to GitHub.
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version-file: .python-version }
      - run: pip install --require-hashes -r requirements-tools.txt
      - run: python pip_audit_check.py   # pip-audit over the four requirements files; every package
  npm:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22.23.4" }
      - run: node scripts/audit.js   # npm audit, but for frontend/audit-allowlist.json's advisories; every advisory
