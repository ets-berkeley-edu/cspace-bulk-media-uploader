[project]
name = "cs-bmu"
version = "0.1.0"
description = "Prototype of the new CollectionSpace Bulk Media Uploader (BMU) for UC Berkeley tenants"
license = { text = "ECL-2.0" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "boto3>=1.34",
  "cryptography>=42",
  "pydantic-settings>=2.3",
  "pyyaml>=6",
  "defusedxml>=0.7",
  "python-multipart>=0.0.9",
  "pillow>=10",
  "tzdata>=2024.1",  # America/Los_Angeles for the job schedule, also where the OS has no time zone database
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "moto[server,dynamodb,s3,kms]>=5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bmu*", "fakecspace*"]

[tool.setuptools.package-data]
bmu = ["tenants/*.yaml", "failures.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
