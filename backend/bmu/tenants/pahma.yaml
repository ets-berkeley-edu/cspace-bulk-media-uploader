# PAHMA tenant configuration, carried over from the legacy uploadmedia.cfg
# (cspace-deployment/cspace-webapps-ucb/pahma/config/uploadmedia.cfg).
key: pahma
name: PAHMA
domain: pahma.cspace.berkeley.edu
media_extension: media_pahma

# Each handling option's presets (design: Handling per document) fill a new row's fields, and fields the user hasn't
# edited when the row's handling changes: type and language (lists of media type values / language refNames; without
# a language preset, rows get the default language below), contributor (a full refName) and copyright (text). Checked
# when the tenant loads. PAHMA has none configured.
handling:
  - id: link
    label: Link to existing object
    legacy: media+accession
    object: existing          # the object must already exist (legacy alwayscreatemedia = False)
    id_rule: object           # Media identificationNumber = object number
    presets: {}
  - id: linkorcreate
    label: Link to object (create if missing)
    object: either            # link to the object if it exists; otherwise create a skeletal Object record
    id_rule: object
    presets: {}
  - id: create
    label: Create new object + link
    legacy: media+create+accession
    object: create            # always a new skeletal Object record; an object that already exists must be fixed
    id_rule: object
    presets: {}
  - id: mediaonly
    label: Media only (no object)
    legacy: mediaonly
    object: none
    id_rule: image            # legacy PAHMA rule: identificationNumber = image number (the filename)
    presets: {}

# Restricted is shown in the UI; it is the inverse of approvedForWeb.
publish:
  field: approvedForWeb
  header: Restricted
  invert: true
  default: false              # not restricted

# Legacy getNumber.py rule for the object number: the text before the first _ (any further _ parts are allowed).
# The image number, used by "Media only", is the whole name without its extension; legacy cut it at the first
# ".", which truncated dotted PAHMA numbers (9-12345.1.2_3 became 9-12345), so that part is deliberately changed.
filename:
  hint: "Object number, optionally followed by _ and anything else, e.g. 15-1234_a.jpg or 1-2345_01_b.tif"
  pattern: '^(?P<obj>[A-Za-z0-9][A-Za-z0-9.-]*)(?:_(?P<suffix>[A-Za-z0-9._-]+))?$'

# Media type option list (PAHMA's pahmaMediaTypes): the value is stored, the label shown. Entries can be
# written as {value: still_image, label: still image} where they differ; PAHMA's values are their labels.
media_types: [document, image, slide, audio, video]

language:
  default: "urn:cspace:pahma.cspace.berkeley.edu:vocabularies:name(languages):item:name(eng)'English'"

# Authority fields: autocomplete searches these vocabularies; values are refNames.
authorities:
  person: { service: personauthorities, vocabulary: person }
  organization: { service: orgauthorities, vocabulary: organization }
# Autocomplete timing from the tenant's UI profile (cspace-ui-plugin-profile-pahma sets autocompleteFindDelay:
# 1000; the minimum length is cspace-ui's default, autocompleteMinLength: 3).
autocomplete: { find_delay_ms: 1000, min_length: 3 }
# The CollectionSpace UI's Media fields list person/local,person/shared,organization/local,organization/shared,
# but PAHMA's profile configures no "shared" Person or Organization vocabulary, so the UI searches local ones only,
# as here. scripts/check_cspace.py --vocabularies lists what the server has.
authority_fields:
  creator: [person, organization]
  contributor: [person, organization]
  rightsHolder: [person, organization]

# Roles (design: Roles): every BMU user has one of these CollectionSpace roles (display names). Staff do
# everything; interns create drafts and edit the drafts that are open to interns. A user with both is staff, a
# user with neither can't sign in. The roles carry no permissions in CollectionSpace: they only tell the BMU what
# the user may do in the BMU. CollectionSpace stores a role as ROLE_<tenantId>_BMU_STAFF (tenant.role_name has
# the naming rule). `python scripts/check_cspace.py --roles` shows an account's roles and what it lacks.
roles:
  staff: [BMU_Staff]
  intern: [BMU_Intern]

# What a staff account must be allowed to do in CollectionSpace to sign in (resource: action letters, as
# accounts/0/accountperms reports them: Create, Read, Update). Creating Objects and creating groups are not
# here: not every staff member may, and the BMU explains those per job.
# VERIFY on the QA tenant that accountperms names the last two resources this way (check_cspace.py --roles).
staff_permissions:
  media: CRU                # create the Media record, attach its file (an update), and search for duplicates
  relations: C              # link a Media record to its Object
  collectionobjects: R      # find the Object, and read its sensitivity fields
  personauthorities: R
  orgauthorities: R
  vocabularies: R
  structureddates: R

# Sensitivity and publishing (design: Protected files). The BMU reads the linked Object record and applies
# these rules: a "protect" rule makes the document a protected file automatically (users can't set or clear
# it); a "warn" rule is a soft signal that only raises a warning. "hides" marks the rule the museum's public
# pipeline uses to hide every image of the object (the Public portal column).
#
# Each rule matches element names anywhere in the Object record's XML. "within" limits the conditions to one
# repeating group (for example one access-restriction entry, whose type and level must match together).
# VERIFY on the QA tenant before relying on them: the element names below are the prototype's best reading of
# PAHMA's profile (cspace-ui-plugin-profile-pahma.js) and must be confirmed with
# `python scripts/check_cspace.py --object <number> --show-object`.
sensitivity:
  summary: "At PAHMA, culturally sensitive objects hide all their images from the public portal; Restricted controls each image."
  explain:
    - "Objects. A status containing “culturally” with the Human Remains department hides every image of that object from the public portal. Documents linked to such objects, or to objects with a NAGPRA status, become protected files automatically."
    - "Access restrictions on the object. A display/visual or publication restriction at the “restriction” level makes documents protected files; at the “preference” or “recommendation” level you get a warning and decide yourself."
    - "Each image. Restricted keeps the image off the public portal (it sends approvedForWeb = false). Protected files default to Restricted."
  protect:
    - reason: "culturally sensitive object in the Human Remains department"
      hides: true
      all:
        - { element: pahmaObjectStatus, contains: culturally }
        - { element: responsibleDepartment, contains: Human Remains }
    - reason: "NAGPRA status on the object"
      all:
        - { element: nagpraStatus, present: true }
    - reason: "display or publication restriction on the object"
      within: accessRestrictionGroup
      all:
        - { element: accessRestrictionType, in: [display/visual, publication] }
        - { element: accessRestrictionLevel, equals: restriction }
  warn:
    - reason: "a display or publication restriction at the preference or recommendation level"
      within: accessRestrictionGroup
      all:
        - { element: accessRestrictionType, in: [display/visual, publication] }
        - { element: accessRestrictionLevel, in: [preference, recommendation] }
