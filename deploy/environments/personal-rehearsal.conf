# AWS environment "personal-rehearsal": a rehearsal, in Richard's personal account, of the BMU's first deployment in UC
# Berkeley's account (docs/testing-checklist.md, section 24): deployed into an existing VPC, as a role with only the
# deployer policy (deploy/iam/bmu-deployer-policy.json), so that every AccessDenied is the policy's and is found before
# Operations attaches it. ./bmu aws rehearsal-vpc --env personal-rehearsal first makes what Operations provides there (a
# VPC with public subnets and a NAT gateway, and that role), as ADMIN_PROFILE, and saves VPC_ID, APP_SUBNET_IDS and
# LB_SUBNET_IDS in personal-rehearsal.local.conf (not committed). The front door is stage 2's: the load balancer on
# DOMAIN_NAME, also in personal-rehearsal.local.conf, a name in a Route 53 zone of this account (BQ23), whose records
# you add by hand as Operations will (checklist section 24). Simulated CollectionSpace only: UC Berkeley data never
# goes in a personal account. About $3 a day while it exists, the NAT gateway even when paused: destroy it
# (./bmu aws destroy --env personal-rehearsal), then ./bmu aws rehearsal-vpc --env personal-rehearsal destroy.

AWS_PROFILE=bmu-rehearsal-deploy  # the deployer role, from bmu-personal (rehearsal-vpc prints its ~/.aws/config section)
REHEARSAL=true
ADMIN_PROFILE=bmu-personal        # the account's administrator: the VPC and the deployer
AWS_REGION=us-west-2
BMU_ENV_NAME=devqar               # resource names: bmu-devqar-...; Terraform state under bmu/devqar/
SIMULATED_CSPACE=true
ALWAYS_RUN_TIME=true              # queued jobs start at once, to try the worker quickly
CREATE_GATEWAY_ENDPOINTS=true     # the rehearsal's VPC has none, so the deployer's endpoint permissions are tried
FRONT_DOOR=alb                    # as stage 2 (ucb-qa.conf)
WAF_ENABLED=true                  # so the deployer's WAF permissions are tried
