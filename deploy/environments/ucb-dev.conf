# AWS environment "ucb-dev": the RTL group's UC Berkeley AWS account. Not set up yet. To use it: create an IAM Identity
# Center sign-in for that account (aws configure sso, profile name below), check the values, then
#   ./bmu aws deploy --env ucb-dev
# Everything else is the same as personal-dev; the state bucket, names and keys are created fresh in that account.

AWS_PROFILE=bmu-ucb
AWS_REGION=us-west-2
BMU_ENV_NAME=dev
CSPACE_URL=https://pahma.qa.collectionspace.org
TENANT=pahma
ENV_LABEL="AWS · UCB dev · PAHMA QA"
ALWAYS_RUN_TIME=false
