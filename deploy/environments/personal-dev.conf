# AWS environment "personal-dev": Richard's personal AWS account (bmu-dev-personal), for trying the deployment before
# it moves to the UC Berkeley account. Read by ./bmu aws (deploy/aws.sh). Nothing secret here: you sign in with
# aws sso login --profile <AWS_PROFILE>, and the account number and allowed addresses go in personal-dev.local.conf,
# which isn't committed (./bmu aws deploy creates it).

AWS_PROFILE=bmu-personal          # the AWS CLI profile (IAM Identity Center sign-in), from aws configure sso
AWS_REGION=us-west-2
BMU_ENV_NAME=dev                  # resource names: bmu-dev-...; Terraform state under bmu/dev/
CSPACE_URL=https://pahma.qa.collectionspace.org
TENANT=pahma
ENV_LABEL="AWS · personal dev · PAHMA QA"
ALWAYS_RUN_TIME=false             # true: queued jobs start at once instead of at the tenant's run time
