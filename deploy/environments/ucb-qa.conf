# AWS environment "ucb-qa": the BMU's QA instance (stage 2) in UC Berkeley's AWS account (the cspace account, us-west-2), in
# Operations' shared dev/QA VPC, deployed as the role rtl-BmuQaDeployer (deploy/iam/README.md) with PAHMA's QA
# CollectionSpace from the first deploy (BQ1). No CloudFront (BQ6): an internet-facing load balancer on the BMU's own
# name, HTTPS only, admitting only the allowed addresses, with a regional WAF. Operations gives the name and handles
# its DNS: the certificate's validation record once, and the name's record pointing at the load balancer (repointed
# after a destroy). Read by ./bmu aws (deploy/aws.sh).
#
# Nothing here is sensitive. The account, network, name and ranges go in ucb-qa.local.conf (not committed):
#   ACCOUNT_ID=...                           (asked and saved at the first command)
#   VPC_ID=vpc-...                           Operations' dev/QA VPC
#   APP_SUBNET_IDS="subnet-...,subnet-..."   its private subnets, two zones, behind its NAT gateway
#   LB_SUBNET_IDS="subnet-...,subnet-..."    its public subnets, two zones, for the load balancer
#   CREATE_GATEWAY_ENDPOINTS=false           the VPC has an S3 gateway endpoint (BQ4; DynamoDB goes through the NAT
#                                            gateway); the app subnets' route table must be in its list (BQ31)
#   DOMAIN_NAME=bmu-qa....                   the name from Operations (BQ22)
#   ALLOWED_CIDRS="..."                      campus and VPN ranges: the load balancer and S3 uploads (BQ31)

AWS_PROFILE=bmu-qa-deploy         # rtl-BmuQaDeployer, from your IAM Identity Center sign-in
AWS_REGION=us-west-2
BMU_ENV_NAME=qa                   # resource names: bmu-qa-...; Terraform state under bmu/qa/ (BQ3 A)
FRONT_DOOR=alb
WAF_ENABLED=true                  # set here, not left to PROTECT_DATA (BQ26)
WAF_MANAGED_RULES=count           # AWS's managed rule sets log only; block after a week of logs (BQ28)
REQUIRE_CLEAN=true                # deployed only from a clean checkout of main (BQ27)
# false until acceptance (BQ17) passes, then true before PAHMA staff use it (BQ24). With true, a destroy and a fresh
# deploy under the same name fail for 30 days (secrets' recovery window, keys' deletion wait).
PROTECT_DATA=false
CSPACE_TENANTS="pahma=https://pahma.qa.collectionspace.org"
ENV_LABEL="AWS · UC Berkeley QA · PAHMA QA"
ALWAYS_RUN_TIME=false
