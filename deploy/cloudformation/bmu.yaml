AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  The new CollectionSpace Bulk Media Uploader (BMU) in AWS, one environment per stack (bmu-<env>): the web app and
  the worker on ECS Fargate, CloudFront (HTTPS, IP allowlist) in front of an internal load balancer, DynamoDB, the S3
  staging bucket and KMS keys. Deployed by ./bmu aws deploy; the image comes from the bmu-<env>-ecr stack.

# Layout: tasks run in public subnets with public IPs (no NAT gateway, which would cost about $35 a month); nothing
# can reach them from outside, because their security groups take traffic only from the load balancer. The load
# balancer is internal (private subnets), reachable only through CloudFront's VPC origin, so the hop from CloudFront
# to it stays inside AWS's network. S3 and DynamoDB traffic from the tasks goes through free gateway endpoints.

Parameters:
  EnvName:
    Type: String
    Description: Environment name within the account, used in every resource name (bmu-<env>-...).
    AllowedPattern: "^[a-z][a-z0-9-]{1,15}$"
  ImageUri:
    Type: String
    Description: The image both services run, <repository URI>:<tag> (./bmu aws deploy builds and pushes it).
  AllowedCidrs:
    Type: String
    Description: >-
      Comma-separated IPv4 addresses or CIDR ranges allowed to open the BMU, e.g. 203.0.113.7/32,198.51.100.0/24.
      Everyone else gets 403 from CloudFront.
    AllowedPattern: "^(\\d{1,3}(\\.\\d{1,3}){3}(/\\d{1,2})?)(,\\d{1,3}(\\.\\d{1,3}){3}(/\\d{1,2})?)*$"
  CSpaceUrl:
    Type: String
    Description: CollectionSpace server, without /cspace-services.
    Default: https://pahma.qa.collectionspace.org
  Tenant:
    Type: String
    Default: pahma
  EnvLabel:
    Type: String
    Description: Shown on the sign-in page, in the header and in the browser tab's title.
    Default: AWS · dev · PAHMA QA
  AlwaysRunTime:
    Type: String
    Description: true makes every moment a run time, so queued jobs start at once (testing only).
    AllowedValues: ["true", "false"]
    Default: "false"
  Running:
    Type: String
    Description: false stops both services (./bmu aws pause) to save money; the data stays.
    AllowedValues: ["true", "false"]
    Default: "true"
  VpcCidr:
    Type: String
    Default: 10.40.0.0/16
    AllowedPattern: "^10\\.\\d{1,3}\\.0\\.0/16$"

Conditions:
  IsRunning: !Equals [!Ref Running, "true"]

Mappings:
  # AWS-managed CloudFront policies (the same IDs in every account)
  CloudFront:
    Policies:
      CachingDisabled: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
      CachingOptimized: 658327ea-f89d-4fab-a63d-7e88639e58f6
      AllViewerExceptHostHeader: b689b0a8-53d0-40ab-baf2-68738e2966ac
      SecurityHeaders: 67f7725c-6f97-4210-82d7-5512b31e9d03

Resources:
  # ---- network ----------------------------------------------------------------------------------------------------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{Key: Name, Value: !Sub "bmu-${EnvName}"}]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{Key: Name, Value: !Sub "bmu-${EnvName}"}]

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 16, 8]]
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags: [{Key: Name, Value: !Sub "bmu-${EnvName}-public-a"}]

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 16, 8]]
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags: [{Key: Name, Value: !Sub "bmu-${EnvName}-public-b"}]

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [10, !Cidr [!Ref VpcCidr, 16, 8]]
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags: [{Key: Name, Value: !Sub "bmu-${EnvName}-private-a"}]

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [11, !Cidr [!Ref VpcCidr, 16, 8]]
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags: [{Key: Name, Value: !Sub "bmu-${EnvName}-private-b"}]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{Key: Name, Value: !Sub "bmu-${EnvName}-public"}]

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:  # no route out: only the VPC itself
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{Key: Name, Value: !Sub "bmu-${EnvName}-private"}]

  PrivateSubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PublicRouteTable]

  DynamoDBEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.dynamodb
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PublicRouteTable]

  # ---- security groups ----------------------------------------------------------------------------------------------
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub bmu-${EnvName}-alb
      GroupDescription: BMU load balancer. The CloudFront VPC origin connects from inside the VPC.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: !Ref VpcCidr, Description: CloudFront VPC origin}
      SecurityGroupEgress:   # replaces the default allow-all: only to the web app's port inside the VPC
        - {IpProtocol: tcp, FromPort: 8000, ToPort: 8000, CidrIp: !Ref VpcCidr, Description: To the web app}

  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub bmu-${EnvName}-web
      GroupDescription: BMU web app tasks. Only the load balancer can connect.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 8000, ToPort: 8000, SourceSecurityGroupId: !Ref AlbSecurityGroup, Description: From the load balancer}

  WorkerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub bmu-${EnvName}-worker
      GroupDescription: BMU worker tasks. Nothing can connect to them (no inbound rules).
      VpcId: !Ref Vpc

  # ---- KMS ------------------------------------------------------------------------------------------------------------
  # The design's key policies (Authentication: Envelope encryption): the session key is used only by the web role;
  # the job key encrypts for the web role and decrypts for the worker role only. The account can manage the keys
  # (and delete them with the stack) but not use them or grant their use (no kms:CreateGrant), so an administrator
  # can't decrypt a saved password without first changing the key policy, which CloudTrail records.
  SessionKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Description: !Sub BMU ${EnvName} - encrypts passwords in sign-in sessions
      EnableKeyRotation: true
      PendingWindowInDays: 7
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountManagesTheKeyButCannotUseIt
            Effect: Allow
            Principal: {AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"}
            Action: [kms:CreateAlias, kms:Describe*, kms:Enable*, kms:List*, kms:Put*, kms:Update*, kms:Revoke*,
                                kms:Disable*, kms:Get*, kms:Delete*, kms:TagResource, kms:UntagResource,
                                kms:ScheduleKeyDeletion, kms:CancelKeyDeletion, kms:RotateKeyOnDemand]
            Resource: "*"
          - Sid: WebAppEncryptsAndDecryptsSessions
            Effect: Allow
            Principal: {AWS: !GetAtt WebTaskRole.Arn}
            Action: [kms:GenerateDataKey, kms:Decrypt]
            Resource: "*"
            Condition: {StringEquals: {"kms:EncryptionContext:purpose": session}}

  SessionKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/bmu-${EnvName}-session
      TargetKeyId: !Ref SessionKey

  JobKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Description: !Sub BMU ${EnvName} - encrypts each queued job's saved sign-in
      EnableKeyRotation: true
      PendingWindowInDays: 7
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountManagesTheKeyButCannotUseIt
            Effect: Allow
            Principal: {AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"}
            Action: [kms:CreateAlias, kms:Describe*, kms:Enable*, kms:List*, kms:Put*, kms:Update*, kms:Revoke*,
                                kms:Disable*, kms:Get*, kms:Delete*, kms:TagResource, kms:UntagResource,
                                kms:ScheduleKeyDeletion, kms:CancelKeyDeletion, kms:RotateKeyOnDemand]
            Resource: "*"
          - Sid: WebAppEncryptsOnly
            Effect: Allow
            Principal: {AWS: !GetAtt WebTaskRole.Arn}
            Action: kms:GenerateDataKey
            Resource: "*"
            Condition: {StringEquals: {"kms:EncryptionContext:purpose": job}}
          - Sid: WorkerDecryptsOnly
            Effect: Allow
            Principal: {AWS: !GetAtt WorkerTaskRole.Arn}
            Action: kms:Decrypt
            Resource: "*"
            Condition: {StringEquals: {"kms:EncryptionContext:purpose": job}}

  JobKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/bmu-${EnvName}-job
      TargetKeyId: !Ref JobKey

  StagingKey:  # SSE-KMS for staged files and thumbnails; used through S3 only (the task roles' policies)
    Type: AWS::KMS::Key
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Description: !Sub BMU ${EnvName} - encrypts staged files in S3
      EnableKeyRotation: true
      PendingWindowInDays: 7
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountPoliciesControlUse
            Effect: Allow
            Principal: {AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"}
            Action: kms:*
            Resource: "*"

  StagingKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/bmu-${EnvName}-staging
      TargetKeyId: !Ref StagingKey

  # ---- DynamoDB (the tables Storage.create_tables makes locally) ------------------------------------------------------
  JobsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub bmu-${EnvName}-jobs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: PK, AttributeType: S}
        - {AttributeName: SK, AttributeType: S}
        - {AttributeName: tenant, AttributeType: S}
        - {AttributeName: created, AttributeType: N}
      KeySchema:
        - {AttributeName: PK, KeyType: HASH}
        - {AttributeName: SK, KeyType: RANGE}
      GlobalSecondaryIndexes:
        - IndexName: tenant
          KeySchema:
            - {AttributeName: tenant, KeyType: HASH}
            - {AttributeName: created, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}

  SessionsTable:  # passwords (encrypted): no backups, TTL as a backstop to the sweep
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub bmu-${EnvName}-sessions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: PK, AttributeType: S}]
      KeySchema: [{AttributeName: PK, KeyType: HASH}]
      TimeToLiveSpecification: {AttributeName: expires, Enabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: false}

  CredentialsTable:  # each queued job's saved sign-in (encrypted): no backups, TTL as a backstop
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub bmu-${EnvName}-credentials
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: PK, AttributeType: S}]
      KeySchema: [{AttributeName: PK, KeyType: HASH}]
      TimeToLiveSpecification: {AttributeName: expires, Enabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: false}

  AuditTable:  # 365-day TTL; the roles can only add entries
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub bmu-${EnvName}-audit
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: PK, AttributeType: S}
        - {AttributeName: SK, AttributeType: S}
      KeySchema:
        - {AttributeName: PK, KeyType: HASH}
        - {AttributeName: SK, KeyType: RANGE}
      TimeToLiveSpecification: {AttributeName: expires, Enabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}

  # ---- S3 -------------------------------------------------------------------------------------------------------------
  LogsBucket:  # S3 access logs for the staging bucket
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub bmu-${EnvName}-s3-logs-${AWS::AccountId}-${AWS::Region}
      OwnershipControls: {Rules: [{ObjectOwnership: BucketOwnerEnforced}]}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}}]
      LifecycleConfiguration:
        Rules: [{Id: expire-logs, Status: Enabled, ExpirationInDays: 90}]

  LogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref LogsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: S3ServerAccessLogs
            Effect: Allow
            Principal: {Service: logging.s3.amazonaws.com}
            Action: s3:PutObject
            Resource: !Sub "${LogsBucket.Arn}/*"
            Condition:
              StringEquals: {"aws:SourceAccount": !Ref AWS::AccountId}
              ArnLike: {"aws:SourceArn": !Sub "arn:${AWS::Partition}:s3:::bmu-${EnvName}-staging-${AWS::AccountId}-${AWS::Region}"}
          - Sid: TlsOnly
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource: [!GetAtt LogsBucket.Arn, !Sub "${LogsBucket.Arn}/*"]
            Condition: {Bool: {"aws:SecureTransport": "false"}}

  StagingBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    DependsOn: LogsBucketPolicy
    Properties:
      BucketName: !Sub bmu-${EnvName}-staging-${AWS::AccountId}-${AWS::Region}
      OwnershipControls: {Rules: [{ObjectOwnership: BucketOwnerEnforced}]}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: "aws:kms", KMSMasterKeyID: !GetAtt StagingKey.Arn}
            BucketKeyEnabled: true
      VersioningConfiguration: {Status: Enabled}  # the worker reads the exact version that was checked
      LoggingConfiguration:
        DestinationBucketName: !Ref LogsBucket
        LogFilePrefix: staging/
      CorsConfiguration:
        CorsRules:
          - Id: browser-uploads   # presigned POSTs from the BMU's own address only
            AllowedMethods: [POST]
            AllowedOrigins: [!Sub "https://${Distribution.DomainName}"]
            AllowedHeaders: ["*"]
            ExposedHeaders: [ETag]
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          # The BMU deletes staged files itself (design: Retention and audit). With versioning on, a deletion
          # leaves the old version behind; these remove it, and the leftover delete markers, after a day.
          - Id: expire-audit-detail   # large runs' per-row audit detail (Storage.put_audit_detail), kept a year
            Status: Enabled
            Prefix: audit/
            ExpirationInDays: 365
          - Id: remove-deleted-versions
            Status: Enabled
            NoncurrentVersionExpiration: {NoncurrentDays: 1}
            ExpiredObjectDeleteMarker: true
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}

  StagingBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StagingBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TlsOnly
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource: [!GetAtt StagingBucket.Arn, !Sub "${StagingBucket.Arn}/*"]
            Condition: {Bool: {"aws:SecureTransport": "false"}}
          - Sid: OnlyKmsEncryptedUploads   # a request that names no encryption gets the bucket's default (the key)
            Effect: Deny
            Principal: "*"
            Action: s3:PutObject
            Resource: !Sub "${StagingBucket.Arn}/*"
            Condition: {StringNotEqualsIfExists: {"s3:x-amz-server-side-encryption": "aws:kms"}}
          - Sid: OnlyTheStagingKey
            Effect: Deny
            Principal: "*"
            Action: s3:PutObject
            Resource: !Sub "${StagingBucket.Arn}/*"
            Condition: {StringNotEqualsIfExists: {"s3:x-amz-server-side-encryption-aws-kms-key-id": !GetAtt StagingKey.Arn}}

  # ---- IAM ------------------------------------------------------------------------------------------------------------
  ExecutionRole:  # lets ECS pull the image and write the logs; the app's own permissions are the task roles below
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub bmu-${EnvName}-ecs-execution
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: sts:AssumeRole}]
      ManagedPolicyArns: [!Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"]

  WebTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub bmu-${EnvName}-web
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              ArnLike: {"aws:SourceArn": !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*"}
              StringEquals: {"aws:SourceAccount": !Ref AWS::AccountId}
      Policies:
        - PolicyName: bmu-web
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: JobsSessionsCredentials
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem,
                                 dynamodb:ConditionCheckItem, dynamodb:Query, dynamodb:Scan,
                                 dynamodb:BatchGetItem, dynamodb:BatchWriteItem]
                Resource:
                  - !GetAtt JobsTable.Arn
                  - !Sub "${JobsTable.Arn}/index/*"
                  - !GetAtt SessionsTable.Arn
                  - !GetAtt CredentialsTable.Arn
              - Sid: AuditAddOnly
                Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt AuditTable.Arn
              - Sid: StagingList   # without it, a missing object reads as 403, not 404
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt StagingBucket.Arn
              # The prototype's web app also reads staged files (it makes TIFF thumbnails, design: Status) and
              # deletes them (deleted documents); in the design those reads belong to the thumbnail Lambda.
              - Sid: StagingObjects
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:GetObjectVersion, s3:DeleteObject]
                Resource: !Sub "${StagingBucket.Arn}/*"
              - Sid: StagingKey
                Effect: Allow
                Action: [kms:GenerateDataKey, kms:Decrypt]
                Resource: !GetAtt StagingKey.Arn

  WorkerTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub bmu-${EnvName}-worker
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              ArnLike: {"aws:SourceArn": !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*"}
              StringEquals: {"aws:SourceAccount": !Ref AWS::AccountId}
      Policies:
        - PolicyName: bmu-worker
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: JobsSessionsCredentials   # the sweeper also deletes idle sessions
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem,
                                 dynamodb:ConditionCheckItem, dynamodb:Query, dynamodb:Scan,
                                 dynamodb:BatchGetItem, dynamodb:BatchWriteItem]
                Resource:
                  - !GetAtt JobsTable.Arn
                  - !Sub "${JobsTable.Arn}/index/*"
                  - !GetAtt SessionsTable.Arn
                  - !GetAtt CredentialsTable.Arn
              - Sid: AuditAddOnly
                Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt AuditTable.Arn
              - Sid: StagingList
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt StagingBucket.Arn
              - Sid: StagingObjects   # reads files to send, writes large audit detail, sweeps old files
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:GetObjectVersion, s3:DeleteObject]
                Resource: !Sub "${StagingBucket.Arn}/*"
              - Sid: StagingKey
                Effect: Allow
                Action: [kms:GenerateDataKey, kms:Decrypt]
                Resource: !GetAtt StagingKey.Arn

  # ---- logs -----------------------------------------------------------------------------------------------------------
  WebLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /bmu/${EnvName}/web
      RetentionInDays: 30

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /bmu/${EnvName}/worker
      RetentionInDays: 30

  # ---- load balancer --------------------------------------------------------------------------------------------------
  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub bmu-${EnvName}
      Scheme: internal
      Type: application
      Subnets: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - {Key: idle_timeout.timeout_seconds, Value: "120"}
        - {Key: routing.http.drop_invalid_header_fields.enabled, Value: "true"}

  WebTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub bmu-${EnvName}-web
      VpcId: !Ref Vpc
      TargetType: ip
      Protocol: HTTP
      Port: 8000
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: "30"}

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Protocol: HTTP
      Port: 80
      DefaultActions: [{Type: forward, TargetGroupArn: !Ref WebTargetGroup}]

  # ---- CloudFront: HTTPS at a *.cloudfront.net address, and the IP allowlist ---------------------------------------
  VpcOrigin:
    Type: AWS::CloudFront::VpcOrigin
    DependsOn: GatewayAttachment   # a VPC origin needs the VPC's internet gateway attached
    Properties:
      VpcOriginEndpointConfig:
        Name: !Sub bmu-${EnvName}
        Arn: !Ref Alb
        HTTPPort: 80
        HTTPSPort: 443
        OriginProtocolPolicy: http-only

  AllowlistFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub bmu-${EnvName}-allowlist
      AutoPublish: true
      FunctionConfig:
        Comment: Only the listed addresses may open the BMU
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        // Generated from the stack's AllowedCidrs parameter; the distribution is IPv4-only, so the viewer's address is IPv4.
        var ALLOWED = "${AllowedCidrs}";
        function ip4(s) {
          var p = s.split(".");
          if (p.length !== 4) return -1;
          var n = 0;
          for (var i = 0; i < 4; i++) {
            var v = parseInt(p[i], 10);
            if (isNaN(v) || v < 0 || v > 255) return -1;
            n = n * 256 + v;
          }
          return n;
        }
        var RANGES = ALLOWED.split(",").map(function (c) {
          var a = c.trim().split("/");
          var bits = a.length > 1 ? parseInt(a[1], 10) : 32;
          var base = ip4(a[0]);
          var size = Math.pow(2, 32 - bits);
          var lo = base - (base % size);
          return { lo: lo, hi: lo + size - 1, ok: base >= 0 && bits >= 0 && bits <= 32 };
        }).filter(function (r) { return r.ok; });
        function handler(event) {
          var ip = ip4(event.viewer.ip);
          for (var i = 0; i < RANGES.length; i++) {
            if (ip >= RANGES[i].lo && ip <= RANGES[i].hi) return event.request;
          }
          return { statusCode: 403, statusDescription: "Forbidden",
                   headers: { "content-type": { value: "text/plain; charset=utf-8" }, "cache-control": { value: "no-store" } },
                   body: { encoding: "text", data: "This BMU environment is open only to listed addresses. Yours is " + event.viewer.ip + ".\n" } };
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub BMU ${EnvName}
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: false
        PriceClass: PriceClass_100
        Origins:
          - Id: web
            DomainName: !GetAtt Alb.DNSName
            VpcOriginConfig:
              VpcOriginId: !GetAtt VpcOrigin.Id
              OriginReadTimeout: 60   # some requests wait on CollectionSpace (sign-in, checks)
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: !FindInMap [CloudFront, Policies, CachingDisabled]
          OriginRequestPolicyId: !FindInMap [CloudFront, Policies, AllViewerExceptHostHeader]
          ResponseHeadersPolicyId: !FindInMap [CloudFront, Policies, SecurityHeaders]
          FunctionAssociations: [{EventType: viewer-request, FunctionARN: !GetAtt AllowlistFunction.FunctionMetadata.FunctionARN}]
        CacheBehaviors:
          - PathPattern: /assets/*   # the built app's files have content hashes in their names
            TargetOriginId: web
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !FindInMap [CloudFront, Policies, CachingOptimized]
            ResponseHeadersPolicyId: !FindInMap [CloudFront, Policies, SecurityHeaders]
            FunctionAssociations: [{EventType: viewer-request, FunctionARN: !GetAtt AllowlistFunction.FunctionMetadata.FunctionARN}]
        # Never keep an error answer: one user's 403 or 404 must not be served to another.
        CustomErrorResponses:
          - {ErrorCode: 400, ErrorCachingMinTTL: 0}
          - {ErrorCode: 403, ErrorCachingMinTTL: 0}
          - {ErrorCode: 404, ErrorCachingMinTTL: 0}
          - {ErrorCode: 405, ErrorCachingMinTTL: 0}
          - {ErrorCode: 500, ErrorCachingMinTTL: 0}
          - {ErrorCode: 502, ErrorCachingMinTTL: 0}
          - {ErrorCode: 503, ErrorCachingMinTTL: 0}
          - {ErrorCode: 504, ErrorCachingMinTTL: 0}

  # ---- ECS ------------------------------------------------------------------------------------------------------------
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub bmu-${EnvName}

  WebTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub bmu-${EnvName}-web
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      RuntimePlatform: {CpuArchitecture: ARM64, OperatingSystemFamily: LINUX}
      Cpu: "256"
      Memory: "1024"
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt WebTaskRole.Arn
      ContainerDefinitions:
        - Name: web
          Image: !Ref ImageUri
          Essential: true
          PortMappings: [{ContainerPort: 8000, Protocol: tcp}]
          Environment:
            - {Name: BMU_CSPACE_URL, Value: !Ref CSpaceUrl}
            - {Name: BMU_TENANT, Value: !Ref Tenant}
            - {Name: BMU_ENV_LABEL, Value: !Ref EnvLabel}
            - {Name: BMU_AWS_REGION, Value: !Ref AWS::Region}
            - {Name: BMU_TABLE_PREFIX, Value: !Sub "bmu-${EnvName}"}
            - {Name: BMU_S3_BUCKET, Value: !Ref StagingBucket}
            - {Name: BMU_S3_KMS_KEY_ID, Value: !GetAtt StagingKey.Arn}
            - {Name: BMU_CRYPTO_MODE, Value: kms}
            - {Name: BMU_KMS_SESSION_KEY_ID, Value: !GetAtt SessionKey.Arn}
            - {Name: BMU_KMS_JOB_KEY_ID, Value: !GetAtt JobKey.Arn}
            - {Name: BMU_COOKIE_SECURE, Value: "true"}
            - {Name: BMU_ALWAYS_RUN_TIME, Value: !Ref AlwaysRunTime}
            - {Name: BMU_DEMO, Value: "false"}   # never in AWS
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WebLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: web

  WorkerTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub bmu-${EnvName}-worker
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      RuntimePlatform: {CpuArchitecture: ARM64, OperatingSystemFamily: LINUX}
      Cpu: "512"
      Memory: "2048"   # TIFF thumbnails and files up to 2 GB streamed through it
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt WorkerTaskRole.Arn
      ContainerDefinitions:
        - Name: worker
          Image: !Ref ImageUri
          Essential: true
          Command: [python, -m, bmu.worker]
          StopTimeout: 120
          Environment:
            - {Name: BMU_CSPACE_URL, Value: !Ref CSpaceUrl}
            - {Name: BMU_TENANT, Value: !Ref Tenant}
            - {Name: BMU_ENV_LABEL, Value: !Ref EnvLabel}
            - {Name: BMU_AWS_REGION, Value: !Ref AWS::Region}
            - {Name: BMU_TABLE_PREFIX, Value: !Sub "bmu-${EnvName}"}
            - {Name: BMU_S3_BUCKET, Value: !Ref StagingBucket}
            - {Name: BMU_S3_KMS_KEY_ID, Value: !GetAtt StagingKey.Arn}
            - {Name: BMU_CRYPTO_MODE, Value: kms}
            - {Name: BMU_KMS_SESSION_KEY_ID, Value: !GetAtt SessionKey.Arn}
            - {Name: BMU_KMS_JOB_KEY_ID, Value: !GetAtt JobKey.Arn}
            - {Name: BMU_COOKIE_SECURE, Value: "true"}
            - {Name: BMU_ALWAYS_RUN_TIME, Value: !Ref AlwaysRunTime}
            - {Name: BMU_DEMO, Value: "false"}   # never in AWS
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WorkerLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: worker

  WebService:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      ServiceName: web
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref WebTask
      DesiredCount: !If [IsRunning, 1, 0]
      HealthCheckGracePeriodSeconds: 60
      PropagateTags: SERVICE
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
          SecurityGroups: [!Ref WebSecurityGroup]
      LoadBalancers: [{ContainerName: web, ContainerPort: 8000, TargetGroupArn: !Ref WebTargetGroup}]

  WorkerService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: worker
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref WorkerTask
      DesiredCount: !If [IsRunning, 1, 0]
      PropagateTags: SERVICE
      DeploymentConfiguration:
        MinimumHealthyPercent: 0   # one worker at a time: the old one stops before the new one starts
        MaximumPercent: 100
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
          SecurityGroups: [!Ref WorkerSecurityGroup]

Outputs:
  Url:
    Description: The BMU's address
    Value: !Sub "https://${Distribution.DomainName}"
  ClusterName:
    Value: !Ref Cluster
  WebServiceName:
    Value: !GetAtt WebService.Name
  WorkerServiceName:
    Value: !GetAtt WorkerService.Name
  StagingBucket:
    Value: !Ref StagingBucket
  LogsBucket:
    Value: !Ref LogsBucket
  WebLogGroup:
    Value: !Ref WebLogGroup
  WorkerLogGroup:
    Value: !Ref WorkerLogGroup
